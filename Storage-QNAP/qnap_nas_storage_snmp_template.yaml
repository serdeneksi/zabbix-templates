        name: 'PSU {#PSUID}: Fan speed'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.24681.1.4.1.1.1.1.3.2.1.5.{#SNMPINDEX}
        key: qnap.psu.fanspeed[{#SNMPINDEX}]
        delay: '{$QNAP.POLL.FAST}'
        history: 31d
        trends: 365d
        value_type: FLOAT
        units: rpm
        tags:
        - tag: component
          value: power
      - uuid: dfa280eeb08042268c8bf6667762140c
        name: 'PSU {#PSUID}: Temperature'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.24681.1.4.1.1.1.1.3.2.1.6.{#SNMPINDEX}
        key: qnap.psu.temp[{#SNMPINDEX}]
        delay: '{$QNAP.POLL.FAST}'
        history: 31d
        trends: 365d
        value_type: FLOAT
        units: °C
        tags:
        - tag: component
          value: power
    - uuid: 91357884881c432d82b325a263f21249
      name: Volume performance discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#BLVID},1.3.6.1.4.1.24681.1.4.1.11.5.6.2.1.2]
      key: qnap.perf.discovery
      delay: 30m
      lifetime: 7d
      item_prototypes:
      - uuid: bff2803835a94f41883af9261f49bb4f
        name: 'Device {#BLVID}: IOPS'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.24681.1.4.1.11.5.6.2.1.3.{#SNMPINDEX}
        key: qnap.perf.iops[{#SNMPINDEX}]
        delay: '{$QNAP.POLL.FAST}'
        history: 31d
        trends: 365d
        value_type: FLOAT
        tags:
        - tag: component
          value: performance
      - uuid: d30421f80c1143f682bd7058fdd19c4b
        name: 'Device {#BLVID}: Latency'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.24681.1.4.1.11.5.6.2.1.4.{#SNMPINDEX}
        key: qnap.perf.latency[{#SNMPINDEX}]
        delay: '{$QNAP.POLL.FAST}'
        history: 31d
        trends: 365d
        value_type: FLOAT
        units: ms
        description: Birim MIB'te belirtilmemis; ms kabul edildi.
        tags:
        - tag: component
          value: performance
        trigger_prototypes:
        - uuid: d4b6dd7486f4434d8a771574d6be3165
          expression: min(/QNAP NAS Storage by SNMP/qnap.perf.latency[{#SNMPINDEX}],5m)>{$QNAP.LATENCY.WARN}
          name: 'Device {#BLVID}: High I/O latency (>{$QNAP.LATENCY.WARN}ms for 5m)'
          priority: WARNING
          tags:
          - tag: component
            value: performance
    - uuid: d9eccdaa06f0442e88235becbcb83837
      name: iSCSI LUN discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#LUNNAME},1.3.6.1.4.1.24681.1.4.1.1.2.1.10.2.1.6,{#LUNCAP},1.3.6.1.4.1.24681.1.4.1.1.2.1.10.2.1.3]
      key: qnap.lun.discovery
      delay: 30m
      lifetime: 7d
      description: iSCSI LUN. Kapasitesi 0 olan (sahte/bos) kayitlar kesfedilmez.
      filter:
        evaltype: AND_OR
        conditions:
        - macro: '{#LUNCAP}'
          value: ^[1-9][0-9]*$
          formulaid: A
      item_prototypes:
      - uuid: 39b1ca083daa4fda853758138ed8242f
        name: 'LUN {#LUNNAME}: Status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.24681.1.4.1.1.2.1.10.2.1.5.{#SNMPINDEX}
        key: qnap.lun.status[{#SNMPINDEX}]
        delay: '{$QNAP.POLL.FAST}'
        history: 31d
        trends: '0'
        value_type: CHAR
        preprocessing:
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        tags:
        - tag: component
          value: iscsi
        trigger_prototypes:
        - uuid: d7825401d5ab46fa8c4359e4577b0049
          expression: find(/QNAP NAS Storage by SNMP/qnap.lun.status[{#SNMPINDEX}],,"iregexp","{$QNAP.STATUS.BAD.MATCHES}")=1
          name: 'LUN {#LUNNAME}: Status is not healthy'
          priority: AVERAGE
          tags:
          - tag: component
            value: iscsi
      - uuid: 31096021f4fd4a40818b83ec50d060fb
        name: 'LUN {#LUNNAME}: Total capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.24681.1.4.1.1.2.1.10.2.1.3.{#SNMPINDEX}
        key: qnap.lun.capacity[{#SNMPINDEX}]
        delay: '{$QNAP.POLL.SLOW}'
        history: 31d
        trends: 365d
        value_type: UNSIGNED
        units: B
        tags:
        - tag: component
          value: iscsi
      - uuid: 0c312bc106214d2481e94109cee420cc
        name: 'LUN {#LUNNAME}: Space utilization (device)'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.24681.1.4.1.1.2.1.10.2.1.4.{#SNMPINDEX}
        key: qnap.lun.pused[{#SNMPINDEX}]
        delay: '{$QNAP.POLL.NORMAL}'
        history: 31d
        trends: 365d
        value_type: FLOAT
        units: '%'
        tags:
        - tag: component
          value: iscsi
        trigger_prototypes:
        - uuid: 94bfcfba2a444c7981a54fe980f71e35
          expression: last(/QNAP NAS Storage by SNMP/qnap.lun.pused[{#SNMPINDEX}])>={$QNAP.LUN.PUSED.WARN}
          name: 'LUN {#LUNNAME}: Used space is high (>={$QNAP.LUN.PUSED.WARN}%)'
          priority: WARNING
          tags:
          - tag: component
            value: iscsi
      - uuid: 55df9dd512ee4c0880d8859cec178313
        name: 'LUN {#LUNNAME}: Used size'
        type: CALCULATED
        key: qnap.lun.used[{#SNMPINDEX}]
        delay: '{$QNAP.POLL.NORMAL}'
        history: 31d
        trends: 365d
        params: last(//qnap.lun.capacity[{#SNMPINDEX}])*last(//qnap.lun.pused[{#SNMPINDEX}])/100
        tags:
        - tag: component
          value: iscsi
        units: B
      - uuid: 42656872db7a47fc831d2a43c8b04b93
        name: 'LUN {#LUNNAME}: Free size'
        type: CALCULATED
        key: qnap.lun.free[{#SNMPINDEX}]
        delay: '{$QNAP.POLL.NORMAL}'
        history: 31d
        trends: 365d
        params: last(//qnap.lun.capacity[{#SNMPINDEX}])*(100-last(//qnap.lun.pused[{#SNMPINDEX}]))/100
        tags:
        - tag: component
          value: iscsi
        units: B
      - uuid: 114502cf65f34e6f8774d72055fa00c8
        name: 'LUN {#LUNNAME}: Free space'
        type: CALCULATED
        key: qnap.lun.pfree[{#SNMPINDEX}]
        delay: '{$QNAP.POLL.NORMAL}'
        history: 31d
        trends: 365d
        params: 100-last(//qnap.lun.pused[{#SNMPINDEX}])
        tags:
        - tag: component
          value: iscsi
        units: '%'
    - uuid: 15b29283ba4e4f908f9771ce4b02ee1d
      name: iSCSI target discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#TARGETNAME},1.3.6.1.4.1.24681.1.4.1.1.2.1.11.2.1.3,{#TARGETIQN},1.3.6.1.4.1.24681.1.4.1.1.2.1.11.2.1.4]
      key: qnap.target.discovery
      delay: 30m
      lifetime: 7d
      description: iSCSI target. IQN'i bos kayitlar kesfedilmez.
      filter:
        evaltype: AND_OR
        conditions:
        - macro: '{#TARGETIQN}'
          value: ^.+$
          formulaid: A
      item_prototypes:
      - uuid: 4b9d676ee87f40cd87f0c318f0b684c8
        name: 'Target {#TARGETNAME}: Status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.24681.1.4.1.1.2.1.11.2.1.5.{#SNMPINDEX}
        key: qnap.target.status[{#SNMPINDEX}]
        delay: '{$QNAP.POLL.FAST}'
        history: 31d
        trends: 365d
        value_type: FLOAT
        valuemap:
          name: QNAP iSCSI target status
        tags:
        - tag: component
          value: iscsi
        trigger_prototypes:
        - uuid: d93235a85786452686af737879eed124
          expression: last(/QNAP NAS Storage by SNMP/qnap.target.status[{#SNMPINDEX}])=-1
          name: 'Target {#TARGETNAME}: Target is offline'
          priority: AVERAGE
          tags:
          - tag: component
            value: iscsi
    macros:
    - macro: '{$QNAP.POLL.FAST}'
      value: 30s
      description: 'Kritik veriler: durum, sicaklik, fan, PSU, CPU, bellek, performans'
    - macro: '{$QNAP.POLL.NORMAL}'
      value: 1m
      description: Bos alan / doluluk / hesaplanan kalemler
    - macro: '{$QNAP.POLL.SLOW}'
      value: 15m
      description: 'Nadiren degisen veriler: toplam kapasite, sayilar'
    - macro: '{$QNAP.CPU.UTIL.WARN}'
      value: '90'
      description: CPU kullanim uyari (%)
    - macro: '{$QNAP.MEM.PUSED.WARN}'
      value: '90'
      description: Bellek kullanim uyari (%)
    - macro: '{$QNAP.CPU.TEMP.WARN}'
      value: '80'
      description: CPU sicaklik uyari (°C)
    - macro: '{$QNAP.CPU.TEMP.CRIT}'
      value: '90'
      description: CPU sicaklik kritik (°C)
    - macro: '{$QNAP.SYS.TEMP.WARN}'
      value: '55'
      description: Sistem/enclosure sicaklik uyari (°C)
    - macro: '{$QNAP.SYS.TEMP.CRIT}'
      value: '65'
      description: Sistem/enclosure sicaklik kritik (°C)
    - macro: '{$QNAP.DISK.TEMP.WARN}'
      value: '50'
      description: Disk sicaklik uyari (°C)
    - macro: '{$QNAP.DISK.TEMP.CRIT}'
      value: '60'
      description: Disk sicaklik kritik (°C)
    - macro: '{$QNAP.VOLUME.PUSED.WARN}'
      value: '80'
      description: Volume doluluk uyari (%)
    - macro: '{$QNAP.VOLUME.PUSED.CRIT}'
      value: '90'
      description: Volume doluluk kritik (%)
    - macro: '{$QNAP.POOL.PUSED.WARN}'
      value: '80'
      description: Pool doluluk uyari (%)
    - macro: '{$QNAP.POOL.PUSED.CRIT}'
      value: '90'
      description: Pool doluluk kritik (%)
    - macro: '{$QNAP.LUN.PUSED.WARN}'
      value: '85'
      description: LUN doluluk uyari (%)
    - macro: '{$QNAP.LATENCY.WARN}'
      value: '50'
      description: Disk latency uyari (ms)
    - macro: '{$QNAP.STATUS.BAD.MATCHES}'
      value: degrad|fail|error|inactive|abnormal|read.?only|not.?active|offline|unmount|crash
      description: RAID/Volume/LUN metin durumunda SORUN regex (harf duyarsiz)
    - macro: '{$QNAP.STATUS.WARN.MATCHES}'
      value: rebuild|resync|synchroniz|recover|migrat|expand|scrub|check
      description: RAID metin durumunda UYARI regex
    tags:
    - tag: class
      value: storage
    - tag: target
      value: qnap
    valuemaps:
    - uuid: a991584ddd2f4ef18fb51194aac355a4
      name: QNAP SMART status
      mappings:
      - value: '0'
        newvalue: Good
      - value: '1'
        newvalue: Warning
      - value: '2'
        newvalue: Abnormal
      - value: '-1'
        newvalue: Error
    - uuid: 4bcfb132bf7140b28ecc3fa4ab44b032
      name: QNAP ok/fail
      mappings:
      - value: '0'
        newvalue: OK
      - value: '-1'
        newvalue: Fail
    - uuid: 1916174a6fa34d458e1dc604e64d2db0
      name: QNAP pool status
      mappings:
      - value: '0'
        newvalue: Ready
      - value: '-1'
        newvalue: Warning
      - value: '-2'
        newvalue: Not ready
      - value: '-3'
        newvalue: Error
    - uuid: 61f39b527db144ab82a758d5e21af967
      name: QNAP iSCSI target status
      mappings:
      - value: '-1'
        newvalue: Offline
      - value: '0'
        newvalue: Ready
      - value: '1'
        newvalue: Connected
    - uuid: 51518414ea5d4df7894b88fef95def8c
      name: QNAP disk slot status
      mappings:
      - value: '0'
        newvalue: Ready (online)
      - value: '-4'
        newvalue: Unknown
      - value: '-5'
        newvalue: No disk
      - value: '-6'
        newvalue: Invalid
      - value: '-9'
        newvalue: Read/Write error
    - uuid: 248673a756bc403e823ae13d5bdd9f41
      name: QNAP health
      mappings:
      - value: '0'
        newvalue: OK
      - value: '1'
        newvalue: Warning
      - value: '2'
        newvalue: Critical
