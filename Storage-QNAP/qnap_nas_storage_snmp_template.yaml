zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 5fac42c63caf410380ed4f72f7c922a3
    name: Templates/SAN
  templates:
  - uuid: 42afe9f454fd4aaa8afadb3991556051
    template: QNAP NAS Storage by SNMP
    name: QNAP NAS Storage by SNMP
    description: |-
      QNAP NAS (QTS / QuTS hero) fiziksel depolama izleme sablonu. SNMP v2c/v3. Kaynak: NAS-MIB (enterprises.24681).
      Polling araliklari {$QNAP.POLL.*} makrolariyla ayarlanir.
    groups:
    - name: Templates/SAN
    items:
    - uuid: a5ca60c58bf14bdd82ed9389897d47c1
      name: 'System: Model'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.24681.1.3.12.0
      key: qnap.system.model
      delay: 1h
      history: 31d
      trends: '0'
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: inventory
    - uuid: d8a3a1f5ac5b474982cfb4cb4d84a745
      name: 'System: Hostname'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.24681.1.3.13.0
      key: qnap.system.hostname
      delay: 1h
      history: 31d
      trends: '0'
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: inventory
    - uuid: 450d9be0c0a14cf18c51ba81f0baf30d
      name: 'System: Uptime'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.24681.1.3.4.0
      key: qnap.system.uptime
      delay: '{$QNAP.POLL.FAST}'
      history: 31d
      trends: 365d
      units: uptime
      description: sysUptimeEX (TimeTicks, 1/100 sn) -> saniye
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 6e7af96f46e94bd788cae5b53b981dbc
        expression: nodata(/QNAP NAS Storage by SNMP/qnap.system.uptime,5m)=1
        name: 'System: No SNMP data for 5m'
        priority: HIGH
        description: NAS SNMP uzerinden yanit vermiyor (SNMP ayarlari, ag veya cihaz kapali).
        tags:
        - tag: component
          value: system
      - uuid: d770fe64a46746338bf3a802ef82ade2
        expression: last(/QNAP NAS Storage by SNMP/qnap.system.uptime)<10m
        name: 'System: Restarted (uptime < 10m)'
        priority: INFO
        description: Cihaz yakin zamanda yeniden basladi.
        manual_close: 'YES'
        tags:
        - tag: component
          value: system
    - uuid: 5d04268848f745b68ae6cacbd4d16b01
      name: 'System: CPU utilization'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.24681.1.3.1.0
      key: qnap.cpu.util
      delay: '{$QNAP.POLL.FAST}'
      history: 31d
      trends: 365d
      units: '%'
      description: Bazi firmware surumleri "5.00 %" gibi metin dondurur; regex ile sayiya cevrilir.
      preprocessing:
      - type: REGEX
        parameters:
        - ([0-9]+(?:\.[0-9]+)?)
        - \1
      tags:
      - tag: component
        value: cpu
      triggers:
      - uuid: a90fbb238ed9441f882a5f7a2c86c53d
        expression: avg(/QNAP NAS Storage by SNMP/qnap.cpu.util,5m)>{$QNAP.CPU.UTIL.WARN}
        name: 'System: High CPU utilization (>{$QNAP.CPU.UTIL.WARN}% for 5m)'
        priority: WARNING
        tags:
        - tag: component
          value: cpu
    - uuid: c6a6b276c65b45b28dcc26728d8a80d5
      name: 'System: CPU temperature'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.24681.1.3.5.0
      key: qnap.cpu.temp
      delay: '{$QNAP.POLL.FAST}'
      history: 31d
      trends: 365d
      units: °C
      tags:
      - tag: component
        value: cpu
      triggers:
      - uuid: be80e66c8edb408e8c25e4b05919b646
        expression: last(/QNAP NAS Storage by SNMP/qnap.cpu.temp)>={$QNAP.CPU.TEMP.WARN} and last(/QNAP NAS Storage by SNMP/qnap.cpu.temp)<{$QNAP.CPU.TEMP.CRIT}
        name: 'System: CPU temperature is high (>={$QNAP.CPU.TEMP.WARN}°C)'
        priority: WARNING
        tags:
        - tag: component
          value: environment
      - uuid: 4ef286e76c264bfd8fabfbbe62fd08ea
        expression: last(/QNAP NAS Storage by SNMP/qnap.cpu.temp)>={$QNAP.CPU.TEMP.CRIT}
        name: 'System: CPU temperature is critical (>={$QNAP.CPU.TEMP.CRIT}°C)'
        priority: HIGH
        tags:
        - tag: component
          value: environment
    - uuid: 4f05db17f56b43c087725ed8ede504b3
      name: 'System: Temperature'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.24681.1.3.6.0
      key: qnap.system.temp
      delay: '{$QNAP.POLL.FAST}'
      history: 31d
      trends: 365d
      units: °C
      tags:
      - tag: component
        value: environment
      triggers:
      - uuid: 2413826756794c558a3c277b8093e910
        expression: last(/QNAP NAS Storage by SNMP/qnap.system.temp)>={$QNAP.SYS.TEMP.WARN} and last(/QNAP NAS Storage by SNMP/qnap.system.temp)<{$QNAP.SYS.TEMP.CRIT}
        name: 'System: Temperature is high (>={$QNAP.SYS.TEMP.WARN}°C)'
        priority: WARNING
        tags:
        - tag: component
          value: environment
      - uuid: c3f1c65e318f4d7d8c32e47feab05b5d
        expression: last(/QNAP NAS Storage by SNMP/qnap.system.temp)>={$QNAP.SYS.TEMP.CRIT}
        name: 'System: Temperature is critical (>={$QNAP.SYS.TEMP.CRIT}°C)'
        priority: HIGH
        tags:
        - tag: component
          value: environment
    - uuid: 7de726fa85dc45f0850e1f9722dd8fd5
      name: 'Memory: Total'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.24681.1.3.2.0
      key: qnap.mem.total
      delay: '{$QNAP.POLL.SLOW}'
      history: 31d
      trends: 365d
      value_type: UNSIGNED
      units: B
      tags:
      - tag: component
        value: memory
    - uuid: 6864787c43594caf88e6826fb00097e6
      name: 'Memory: Free'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.24681.1.3.3.0
      key: qnap.mem.free
      delay: '{$QNAP.POLL.FAST}'
      history: 31d
      trends: 365d
      value_type: UNSIGNED
      units: B
      tags:
      - tag: component
        value: memory
    - uuid: f75c6219fce446a089c05cd6d0d9c618
      name: 'Memory: Used'
      type: CALCULATED
      key: qnap.mem.used
      delay: '{$QNAP.POLL.FAST}'
      history: 31d
      trends: 365d
      params: last(//qnap.mem.total)-last(//qnap.mem.free)
      tags:
      - tag: component
        value: memory
      units: B
    - uuid: c4504d8ea4644d2b854e4e37f86b208f
      name: 'Memory: Utilization'
      type: CALCULATED
      key: qnap.mem.pused
      delay: '{$QNAP.POLL.FAST}'
      history: 31d
      trends: 365d
      params: 100*(1-last(//qnap.mem.free)/last(//qnap.mem.total))
      tags:
      - tag: component
        value: memory
      units: '%'
      triggers:
      - uuid: 44ef1dbace164d418215426cc60036ce
        expression: min(/QNAP NAS Storage by SNMP/qnap.mem.pused,5m)>{$QNAP.MEM.PUSED.WARN}
        name: 'System: High memory utilization (>{$QNAP.MEM.PUSED.WARN}% for 5m)'
        priority: WARNING
        tags:
        - tag: component
          value: memory
    - uuid: 9c817b50e0764e64861ad8ddc4fa45d7
      name: 'Memory: Free (percent)'
      type: CALCULATED
      key: qnap.mem.pfree
      delay: '{$QNAP.POLL.FAST}'
      history: 31d
      trends: 365d
      params: 100*last(//qnap.mem.free)/last(//qnap.mem.total)
      tags:
      - tag: component
        value: memory
      units: '%'
    - uuid: 3e1bddf61774499e8709beb20d85a376
      name: 'Storage: Number of physical disks'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.24681.1.4.1.1.1.1.5.1.0
      key: qnap.disk.count
      delay: '{$QNAP.POLL.NORMAL}'
      history: 31d
      trends: 365d
      value_type: UNSIGNED
      tags:
      - tag: component
        value: disk
      triggers:
      - uuid: a6415efbd30f478a8ed02fc5400f1675
        expression: change(/QNAP NAS Storage by SNMP/qnap.disk.count)<0
        name: 'Storage: Number of physical disks decreased'
        priority: HIGH
        description: Disk sayisi dustu. Kontrol sonrasi elle kapatin.
        manual_close: 'YES'
        tags:
        - tag: component
          value: disk
    - uuid: acad220145854b3180543d670395f9b2
      name: 'Storage: Number of RAID groups'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.24681.1.4.1.1.1.2.1.1.0
      key: qnap.raid.count
      delay: '{$QNAP.POLL.SLOW}'
      history: 31d
      trends: 365d
      value_type: UNSIGNED
      tags:
      - tag: component
        value: raid
    - uuid: 7eeebfa89a0343e588b5763f201449ea
      name: 'Storage: Number of volumes'
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.4.1.24681.1.3.16.0
      key: qnap.volume.count
      delay: '{$QNAP.POLL.SLOW}'
      history: 31d
      trends: 365d
      value_type: UNSIGNED
      tags:
      - tag: component
        value: volume
    - uuid: 45a88c9b553a43ba8cd2ede92948531d
      name: 'Storage: Total capacity (all volumes)'
      type: CALCULATED
      key: qnap.storage.total
      delay: '{$QNAP.POLL.NORMAL}'
      history: 31d
      trends: 365d
      params: sum(last_foreach(//qnap.volume.total[*]))
      tags:
      - tag: component
        value: volume
      units: B
    - uuid: 37872e255e61447c834f2e743423eaf5
      name: 'Storage: Free space (all volumes)'
      type: CALCULATED
      key: qnap.storage.free
      delay: '{$QNAP.POLL.NORMAL}'
      history: 31d
      trends: 365d
      params: sum(last_foreach(//qnap.volume.free[*]))
      tags:
      - tag: component
        value: volume
      units: B
    - uuid: 756166d9bdf0401c8dd6870e003fc9ab
      name: 'Storage: Used space (all volumes)'
      type: CALCULATED
      key: qnap.storage.used
      delay: '{$QNAP.POLL.NORMAL}'
      history: 31d
      trends: 365d
      params: last(//qnap.storage.total)-last(//qnap.storage.free)
      tags:
      - tag: component
        value: volume
      units: B
    - uuid: 75de98ebe7934adc85bdf919d9760a57
      name: 'Storage: Space utilization (all volumes)'
      type: CALCULATED
      key: qnap.storage.pused
      delay: '{$QNAP.POLL.NORMAL}'
      history: 31d
      trends: 365d
      params: 100*last(//qnap.storage.used)/last(//qnap.storage.total)
      tags:
      - tag: component
        value: volume
      units: '%'
      triggers:
      - uuid: fbe362be06a4497e8ada672fc7f6385f
        expression: last(/QNAP NAS Storage by SNMP/qnap.storage.pused)>={$QNAP.VOLUME.PUSED.WARN} and last(/QNAP NAS Storage by SNMP/qnap.storage.pused)<{$QNAP.VOLUME.PUSED.CRIT}
        name: 'Storage: Total space is low (>={$QNAP.VOLUME.PUSED.WARN}%)'
        priority: WARNING
        tags:
        - tag: component
          value: volume
      - uuid: 92c44ba0be7d42328ac60d0695de6cab
        expression: last(/QNAP NAS Storage by SNMP/qnap.storage.pused)>={$QNAP.VOLUME.PUSED.CRIT}
        name: 'Storage: Total space is critically low (>={$QNAP.VOLUME.PUSED.CRIT}%)'
        priority: HIGH
        tags:
        - tag: component
          value: volume
    - uuid: d08470cd817c4a7a849a80f38cab2499
      name: 'Storage: Free space percent (all volumes)'
      type: CALCULATED
      key: qnap.storage.pfree
      delay: '{$QNAP.POLL.NORMAL}'
      history: 31d
      trends: 365d
      params: 100*last(//qnap.storage.free)/last(//qnap.storage.total)
      tags:
      - tag: component
        value: volume
      units: '%'
    - uuid: 67da628b57ef4c3a82c94700fbe58192
      name: 'Storage: Components in critical state'
      type: CALCULATED
      key: qnap.health.crit
      delay: '{$QNAP.POLL.FAST}'
      history: 31d
      trends: 365d
      params: count(last_foreach(//qnap.disk.health[*]),"eq",2)+count(last_foreach(//qnap.raid.health[*]),"eq",2)+count(last_foreach(//qnap.volume.health[*]),"eq",2)+count(last_foreach(//qnap.pool.health[*]),"eq",2)+count(last_foreach(//qnap.slot.health[*]),"eq",2)+count(last_foreach(//qnap.fan.status[*]),"ne",0)+count(last_foreach(//qnap.psu.status[*]),"ne",0)
      tags:
      - tag: component
        value: health
      description: Kritik durumdaki disk/slot/RAID/volume/pool/fan/PSU sayisi.
    - uuid: a04b2591610a4e89804783ce9f7a58b5
      name: 'Storage: Components in warning state'
      type: CALCULATED
      key: qnap.health.warn
      delay: '{$QNAP.POLL.FAST}'
      history: 31d
      trends: 365d
      params: count(last_foreach(//qnap.disk.health[*]),"eq",1)+count(last_foreach(//qnap.raid.health[*]),"eq",1)+count(last_foreach(//qnap.pool.health[*]),"eq",1)
      tags:
      - tag: component
        value: health
    - uuid: 06128f1ff3b6477b84218e8d7196d714
      name: 'Storage: Overall health'
      type: CALCULATED
      key: qnap.health.overall
      delay: '{$QNAP.POLL.FAST}'
      history: 31d
      trends: 365d
      params: (last(//qnap.health.crit)>0)*2+(last(//qnap.health.crit)=0)*(last(//qnap.health.warn)>0)
      tags:
      - tag: component
        value: health
      valuemap:
        name: QNAP health
      description: 0=OK, 1=Warning, 2=Critical. Diskler, RAID, volume, pool, fan ve PSU durumlarindan turetilir.
      triggers:
      - uuid: d8099e907a4d4aba8921b91a5604d880
        expression: last(/QNAP NAS Storage by SNMP/qnap.health.overall)=2
        name: 'Storage: Overall health is critical'
        priority: HIGH
        description: Bir veya daha fazla bilesen kritik durumda. Ayrintilar icin ilgili disk/RAID/volume/pool/fan/PSU tetikleyicilerine bakin.
        tags:
        - tag: component
          value: health
    discovery_rules:
    - uuid: bdffc896079649c08c6c9f37ef8750eb
      name: Physical disk discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#DISKMODEL},1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.8,{#DISKCAP},1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.9]
      key: qnap.disk.discovery
      delay: 30m
      lifetime: 7d
      description: Tum fiziksel diskler (NAS-MIB diskTable).
      item_prototypes:
      - uuid: 5e968c1a8af24050820f9849dabc8f34
        name: 'Disk {#SNMPINDEX} ({#DISKMODEL}): Status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.4.{#SNMPINDEX}
        key: qnap.disk.summary[{#SNMPINDEX}]
        delay: '{$QNAP.POLL.FAST}'
        history: 31d
        trends: '0'
        value_type: CHAR
        description: 'NAS-MIB diskSummary: Good / Warning / Abnormal'
        preprocessing:
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        tags:
        - tag: component
          value: disk
        trigger_prototypes:
        - uuid: 2a9031d4991542de8670de2c98d28185
          expression: find(/QNAP NAS Storage by SNMP/qnap.disk.summary[{#SNMPINDEX}],,"iregexp","^(good|warning)")=0
          name: 'Disk {#SNMPINDEX} ({#DISKMODEL}): Status is abnormal'
          priority: HIGH
          description: Disk durumu "Good" veya "Warning" disinda.
          tags:
          - tag: component
            value: disk
        - uuid: a48e9cb0e36b4b0683fbfa730e77a0b9
          expression: find(/QNAP NAS Storage by SNMP/qnap.disk.summary[{#SNMPINDEX}],,"iregexp","^warning")=1
          name: 'Disk {#SNMPINDEX} ({#DISKMODEL}): Status is warning'
          priority: WARNING
          tags:
          - tag: component
            value: disk
      - uuid: 4b7d3b1024214054858d8a6c8c6e3945
        name: 'Disk {#SNMPINDEX} ({#DISKMODEL}): SMART status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.5.{#SNMPINDEX}
        key: qnap.disk.smart[{#SNMPINDEX}]
        delay: '{$QNAP.POLL.FAST}'
        history: 31d
        trends: 365d
        value_type: FLOAT
        valuemap:
          name: QNAP SMART status
        tags:
        - tag: component
          value: disk
        trigger_prototypes:
        - uuid: 333dd5233941485b849ace5acd405afc
          expression: last(/QNAP NAS Storage by SNMP/qnap.disk.smart[{#SNMPINDEX}])=2 or last(/QNAP NAS Storage by SNMP/qnap.disk.smart[{#SNMPINDEX}])=-1
          name: 'Disk {#SNMPINDEX} ({#DISKMODEL}): SMART abnormal/error'
          priority: HIGH
          description: SMART abnormal(2) veya error(-1).
          tags:
          - tag: component
            value: disk
        - uuid: f0218fdf4463457b87f239e07d661d72
          expression: last(/QNAP NAS Storage by SNMP/qnap.disk.smart[{#SNMPINDEX}])=1
          name: 'Disk {#SNMPINDEX} ({#DISKMODEL}): SMART warning'
          priority: WARNING
          tags:
          - tag: component
            value: disk
      - uuid: bff28c9891ad4b838176396489acdcc9
        name: 'Disk {#SNMPINDEX} ({#DISKMODEL}): Temperature'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.6.{#SNMPINDEX}
        key: qnap.disk.temp[{#SNMPINDEX}]
        delay: '{$QNAP.POLL.FAST}'
        history: 31d
        trends: 365d
        value_type: FLOAT
        units: °C
        tags:
        - tag: component
          value: disk
        trigger_prototypes:
        - uuid: c07f30c62d7d460589d0ebaaa9382faa
          expression: last(/QNAP NAS Storage by SNMP/qnap.disk.temp[{#SNMPINDEX}])>={$QNAP.DISK.TEMP.WARN} and last(/QNAP NAS Storage by SNMP/qnap.disk.temp[{#SNMPINDEX}])<{$QNAP.DISK.TEMP.CRIT}
          name: 'Disk {#SNMPINDEX} ({#DISKMODEL}): Temperature is high (>={$QNAP.DISK.TEMP.WARN}°C)'
          priority: WARNING
          tags:
          - tag: component
            value: disk
        - uuid: 7f05b1e94b8b49a58fdae493b99575c9
          expression: last(/QNAP NAS Storage by SNMP/qnap.disk.temp[{#SNMPINDEX}])>={$QNAP.DISK.TEMP.CRIT}
          name: 'Disk {#SNMPINDEX} ({#DISKMODEL}): Temperature is critical (>={$QNAP.DISK.TEMP.CRIT}°C)'
          priority: HIGH
          tags:
          - tag: component
            value: disk
      - uuid: ab4eb97819844fb682c2840ed03a7330
        name: 'Disk {#SNMPINDEX} ({#DISKMODEL}): Capacity'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.9.{#SNMPINDEX}
        key: qnap.disk.capacity[{#SNMPINDEX}]
        delay: '{$QNAP.POLL.SLOW}'
        history: 31d
        trends: 365d
        value_type: UNSIGNED
        units: B
        tags:
        - tag: component
          value: disk
      - uuid: ecfdea0230fe4f8a8574c54c8a09986c
        name: 'Disk {#SNMPINDEX} ({#DISKMODEL}): Health'
        type: CALCULATED
        key: qnap.disk.health[{#SNMPINDEX}]
        delay: '{$QNAP.POLL.FAST}'
        history: 31d
        trends: 365d
        params: 2*(((1-find(//qnap.disk.summary[{#SNMPINDEX}],,"iregexp","^(good|warning)"))+(last(//qnap.disk.smart[{#SNMPINDEX}])=2)+(last(//qnap.disk.smart[{#SNMPINDEX}])=-1))>0)+(1-(((1-find(//qnap.disk.summary[{#SNMPINDEX}],,"iregexp","^(good|warning)"))+(last(//qnap.disk.smart[{#SNMPINDEX}])=2)+(last(//qnap.disk.smart[{#SNMPINDEX}])=-1))>0))*((find(//qnap.disk.summary[{#SNMPINDEX}],,"iregexp","^warning")+(last(//qnap.disk.smart[{#SNMPINDEX}])=1))>0)
        tags:
        - tag: component
          value: disk
        valuemap:
          name: QNAP health
        description: 0=OK, 1=Warning, 2=Critical (durum metni + SMART).
    - uuid: 33cf0b088cc14f2e818269e2567f1ff5
      name: Disk slot discovery (online/offline)
      type: SNMP_AGENT
      snmp_oid: discovery[{#SLOTNAME},1.3.6.1.4.1.24681.1.3.11.1.2,{#SLOTMODEL},1.3.6.1.4.1.24681.1.3.11.1.5]
      key: qnap.slot.discovery
      delay: 30m
      lifetime: 7d
      description: hdTableEX slotlarini kesfeder. Disk online/offline durumu icin kullanilir.
      item_prototypes:
      - uuid: 51ebf0b04677403880336b99cfc9c1d7
        name: 'Slot {#SLOTNAME} ({#SLOTMODEL}): Disk state'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.24681.1.3.11.1.4.{#SNMPINDEX}
        key: qnap.slot.status[{#SNMPINDEX}]
        delay: '{$QNAP.POLL.FAST}'
        history: 31d
        trends: 365d
        value_type: FLOAT
        description: 0=Ready (online), -4=Unknown, -5=No disk, -6=Invalid, -9=Read/Write error
        valuemap:
          name: QNAP disk slot status
        tags:
        - tag: component
          value: disk
        trigger_prototypes:
        - uuid: 6e36b07d93df4fc08bfd64f34f2d7f0b
          expression: last(/QNAP NAS Storage by SNMP/qnap.slot.status[{#SNMPINDEX}])<0 and last(/QNAP NAS Storage by SNMP/qnap.slot.status[{#SNMPINDEX}])<>-5
          name: 'Slot {#SLOTNAME} ({#SLOTMODEL}): Disk is offline / not ready'
          priority: HIGH
